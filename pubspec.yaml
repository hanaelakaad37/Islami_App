name: islami
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter





  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0

flutter_gen:
  output: lib/core/gen/

  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/files/Suras/
    - assets/files/Hadeeth/

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna_LT.ttf
